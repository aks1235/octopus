name: release

on:
  push:
    branches:
      - dev-v2
    tags:
      - 'v*'

permissions:
  contents: write

env:
  DOCKER_IMAGE: raynmy/octopus

jobs:
  # tag push 时：生成 changelog + 合并 dev-v2 → master
  changelog:
    name: changelog
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.ACTION_TOKEN }}

      - name: Generate changelog
        run: npx changelogithub
        env:
          GITHUB_TOKEN: ${{ secrets.ACTION_TOKEN }}

      - name: Merge dev-v2 to master
        run: |
          git config --global user.name 'GitHub Actions'
          git config --global user.email 'github-actions@github.com'
          if ! git show-ref --verify --quiet refs/heads/master; then
            git checkout -b master
          else
            git checkout master
          fi
          git fetch origin dev-v2
          git merge origin/dev-v2
          git remote set-url origin https://x-access-token:${{ secrets.ACTION_TOKEN }}@github.com/${{ github.repository }}
          git push origin master --force

  # tag push 时：构建 + 发布 Release + Docker latest
  # dev-v2 push 时：只构建 Docker dev 镜像
  build:
    name: build
    runs-on: ubuntu-latest
    needs: [changelog]
    if: always()  # dev-v2 push 时 changelog 被跳过，但 build 仍需运行
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.13'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: '11.10.0'
          cache: true
          cache_dependency_path: web/pnpm-lock.yaml

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 'latest'
          cache: 'pnpm'
          cache-dependency-path: web/pnpm-lock.yaml

      - name: Get version info
        id: tag
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            LATEST_TAG="${GITHUB_REF_NAME}"
          else
            CURRENT_TAGS=$(git tag --points-at HEAD 2>/dev/null | sort -V | tail -1)
            if [ -n "$CURRENT_TAGS" ]; then
              LATEST_TAG="$CURRENT_TAGS"
            else
              # 分支 push 不得解析出已打过的 tag 名: git describe --abbrev=0 会命中
              # 祖先链上的新 tag, 导致 dev run 以同名镜像 tag 覆盖 tag run 刚推的镜像
              # (v2.0.4 实际踩过: 生产拉到 fd92a84 版本串 v2.0.3-1-gfd92a84 的镜像)。
              # 分支构建一律钉 dev, 版本追溯走 short_sha 镜像 tag。
              LATEST_TAG='dev'
            fi
          fi
          SHORT_SHA=$(git rev-parse --short HEAD)
          echo "tag_name=$LATEST_TAG" >> $GITHUB_OUTPUT
          echo "short_sha=$SHORT_SHA" >> $GITHUB_OUTPUT
          echo "OCTOPUS_VERSION=$LATEST_TAG" >> $GITHUB_ENV

      - name: Build frontend
        working-directory: web
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
        env:
          VITE_APP_VERSION: ${{ env.OCTOPUS_VERSION }}
          VITE_GITHUB_REPO: https://github.com/aks1235/octopus

      - name: Update price
        run: python3 scripts/updatePrice.py

      # 【为什么注释】Android 构建已停用(scripts/build.sh 的 ANDROID_TARGETS 亦已注释),
      # 本步骤会下载约 1GB NDK,是发布耗时的主要来源之一。
      # 【如何恢复】取消下面整段注释,并同时取消 Build 步骤的 ANDROID_NDK_HOME env 注释,
      #            以及 scripts/build.sh 中 Android 相关注释。注意 steps.setup-ndk 输出被 Build 步骤引用。
      # - name: Setup Android NDK
      #   id: setup-ndk
      #   uses: nttld/setup-ndk@v1
      #   with:
      #     ndk-version: r28c

      - name: Build
        run: bash scripts/build.sh
        # 【为什么注释】ANDROID_NDK_HOME 只服务于已停用的 Android 构建,且其值来自已注释的 setup-ndk 步骤。
        # 【如何恢复】与上面 "Setup Android NDK" 步骤一起取消注释。
        # env:
        #   ANDROID_NDK_HOME: ${{ steps.setup-ndk.outputs.ndk-path }}

      - name: Upload Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: build/archives/*
          prerelease: false
          tag_name: ${{ steps.tag.outputs.tag_name }}

      # 【为什么注释】Debian 镜像整段停用,只保留 Alpine(部署 compose 使用 Alpine 那套)。
      # meta 与 build 步骤必须成对恢复,否则 build 步骤会引用不存在的 meta-debian 输出。
      # 【如何恢复】取消本段与下面 "Build and push (Debian)" 整段注释即可。
      # - name: Docker meta (Debian)
      #   id: meta-debian
      #   uses: docker/metadata-action@v5
      #   with:
      #     images: ${{ env.DOCKER_IMAGE }}
      #     tags: |
      #       type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/') }}
      #       type=raw,value=${{ steps.tag.outputs.tag_name }},enable=${{ startsWith(github.ref, 'refs/tags/') }}
      #       type=raw,value=${{ steps.tag.outputs.short_sha }}
      #       type=raw,value=dev,enable=${{ github.ref == 'refs/heads/dev-v2' }}

      - name: Docker meta (Alpine)
        id: meta-alpine
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKER_IMAGE }}
          tags: |
            type=raw,value=latest-alpine,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ steps.tag.outputs.tag_name }}-alpine,enable=${{ startsWith(github.ref, 'refs/tags/') }}
            type=raw,value=${{ steps.tag.outputs.short_sha }}-alpine
            type=raw,value=dev-alpine,enable=${{ github.ref == 'refs/heads/dev-v2' }}

      # 【为什么注释】只剩 linux/amd64 单平台,runner 自身即 amd64,不需要 QEMU 跨架构模拟
      # (非 amd64 平台全部依赖 QEMU 模拟,是原发布耗时的大头)。
      # 【如何恢复】取消本步骤注释,并把下面 Build and push 的 platforms 改回多平台列表。
      # - name: Set up QEMU
      #   uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push (Alpine)
        uses: docker/build-push-action@v5
        with:
          # 【为什么只留 amd64】部署 compose 固定 TARGETPLATFORM=linux/amd64,其余平台全靠 QEMU 模拟,纯耗时。
          # 【如何恢复】改回:platforms: linux/amd64,linux/i386,linux/arm64,linux/arm/v7
          #            并取消 "Set up QEMU" 步骤注释。
          context: .
          file: ./scripts/dockerfiles/Dockerfile.alpine
          push: true
          platforms: linux/amd64
          tags: ${{ steps.meta-alpine.outputs.tags }}
          labels: ${{ steps.meta-alpine.outputs.labels }}
          # 【为什么不再写 build-args】原为裸名 `TARGETPLATFORM`(值取自调用方环境变量, CI 里该变量不存在)。
          # TARGETPLATFORM 属 BuildKit 的自动构建参数: 由 --platform 按目标平台注入, Dockerfile 里
          # 声明 ARG 即可用, 无需手工传参, 也不该用可能为空的值去覆盖它
          # (本地实测: 显式传空值会让 COPY build/docker/${TARGETPLATFORM}/octopus 塌成
          #  build/docker//octopus 而失败; 不传则自动注入正确)。
          # 【如何恢复】不用恢复, 保持不写; 多平台构建同样由 BuildKit 自动注入每个目标平台的值。

      # 【为什么注释】Debian 镜像整段停用(与上面 "Docker meta (Debian)" 成对注释);
      # 两者都引用 meta-debian 输出,必须一起恢复。
      # 【如何恢复】取消本段注释,并把 platforms 改回: linux/amd64,linux/i386,linux/arm64,linux/arm/v7
      # - name: Build and push (Debian)
      #   uses: docker/build-push-action@v5
      #   with:
      #     context: .
      #     file: ./scripts/dockerfiles/Dockerfile.debian
      #     push: true
      #     platforms: linux/amd64,linux/i386,linux/arm64,linux/arm/v7
      #     tags: ${{ steps.meta-debian.outputs.tags }}
      #     labels: ${{ steps.meta-debian.outputs.labels }}
      #     build-args: |
      #       TARGETPLATFORM
