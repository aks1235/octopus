# 生产 compose:容器 octopus-new(8080),数据挂 ./data。image tag 随每次发版更新
# (发布流程见 .claude/skills/octopus-publish;推 dev-v2 + tag 后由 CI 出镜像)。
services:
  octopus:
    image: raynmy/octopus:v2.1.5
    build:
      context: .
      dockerfile: scripts/dockerfiles/Dockerfile.alpine
      args:
        TARGETPLATFORM: linux/amd64
    ports:
       - '8080:8080'
    volumes:
       - './data:/app/data'
    container_name: octopus-new
    restart: unless-stopped
    network_mode: bridge
